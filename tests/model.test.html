<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Tests Datenmodell</title></head>
<body>
<pre id="out"></pre>
<script src="../js/util.js"></script>
<script src="../js/grades.js"></script>
<script src="../js/model.js"></script>
<script>
  const M = NM.model;
  const G = NM.grades;
  const lines = [];
  let fails = 0;
  const ok = (name, cond) => { if (!cond) fails++; lines.push((cond ? 'OK   ' : 'FAIL ') + name); };
  const throws = (name, fn, cls) => { try { fn(); ok(name, false); } catch (e) { ok(name, !cls || e instanceof cls); } };

  // Migration einer älteren Datenbank ohne neuere Felder
  const old = { schema: 1, years: [{ id: 'y', name: '2025/26' }], courses: [{ id: 'c', yearId: 'y', jahrgang: 8, students: [] }] };
  const m = M.migrate(JSON.parse(JSON.stringify(old)));
  ok('Fehlende Einstellungen ergänzt', m.settings.limitSek1 === 50 && m.settings.autoLockMin === 15);
  ok('Fehlende Kursfelder ergänzt', m.courses[0].wHalf1 === 1 && m.courses[0].wHalf2 === 2 && Array.isArray(m.courses[0].assessments));
  ok('Programmversion vermerkt', m.savedWith === M.APP_VERSION);
  ok('Datenbank ohne schema-Feld wird geöffnet', !!M.migrate({ years: [], courses: [] }));

  // Schutz vor älterer App-Version
  const tb = M.migrate({ schema: 4, years: [], courses: [{ id: 'c', jahrgang: 8, students: [], assessments: [], tabs: { seating: false, xyz: true } }], settings: { tabs: { pres: false } } });
  ok('Reiter: Standard {} ergänzt, vorhandene Auswahl und Kursauswahl bleiben', M.migrate({ years: [], courses: [] }).settings.tabs && Object.keys(M.migrate({ years: [], courses: [] }).settings.tabs).length === 0 && tb.settings.tabs.pres === false && tb.courses[0].tabs.seating === false && tb.courses[0].tabs.xyz === true);
  throws('Neueres Datenformat wird abgelehnt', () => M.migrate({ schema: M.SCHEMA + 1, savedWith: '9.0.0', years: [], courses: [] }), M.NewerSchemaError);
  try { M.migrate({ schema: M.SCHEMA + 1, savedWith: '9.0.0' }); } catch (e) { ok('Meldung nennt beide Versionen', e.message.includes('9.0.0') && e.message.includes(M.APP_VERSION)); }
  const newer = { schema: M.SCHEMA + 1, years: [], courses: [], neuesFeld: 1 };
  try { M.migrate(newer); } catch (e) { /* erwartet */ }
  ok('Abgelehnte Datenbank bleibt unverändert', newer.schema === M.SCHEMA + 1 && !newer.settings);
  throws('Kaputter Inhalt wird abgelehnt', () => M.migrate(null));

  // Unbekannte Felder bleiben erhalten (Vorwärtsverträglichkeit innerhalb eines Schemas)
  // 1.20: Präsentationen – Kriterienpool mit Startbestand, nur wenn noch keiner da ist
  const np = M.migrate({ schema: 2, years: [], courses: [] });
  ok('Kriterienpool beim Öffnen angelegt (Startbestand)', np.schema === M.SCHEMA && np.criteriaPool.length >= 10 && np.criteriaPool.every((c) => c.id && c.name && c.desc && c.desc[0] && c.desc[3]));
  const own = M.migrate({ schema: 3, years: [], courses: [], criteriaPool: [] });
  ok('Leerer Pool bleibt leer (vom Nutzer geleert)', own.criteriaPool.length === 0);
  const full = M.defaultCriteriaPool();
  ok('Startbestand: fein gegliederte Kriterien (z. B. Medien: Übersichtlichkeit, Lesbarkeit, Gestaltung)', full.length >= 25 && ['Übersichtlichkeit', 'Lesbarkeit', 'Ansprechende Gestaltung'].every((n) => full.some((c) => c.name === n && c.group === 'Medien')) && new Set(full.map((c) => c.name)).size === full.length);
  ok('Startbestand ergänzen: nur fehlende (Bezeichnung, Groß/klein egal)', M.missingDefaultCriteria([]).length === full.length && M.missingDefaultCriteria([{ name: 'lesbarkeit' }, { name: 'Eigenes' }]).length === full.length - 1 && M.missingDefaultCriteria(full).length === 0);
  ok('Vorlagen: beim Öffnen Standardvorlagen, vorhandene bleiben unverändert', Array.isArray(np.presTemplates) && np.presTemplates.length === 3 && M.migrate({ schema: 3, years: [], courses: [], presTemplates: [{ id: 't', name: 'X', criteria: [] }] }).presTemplates.length === 1 && M.migrate({ schema: 3, years: [], courses: [], presTemplates: [] }).presTemplates.length === 0);
  ok('SCHEMA 4 (Gruppenpräsentationen)', M.SCHEMA === 4);
  ok('Kriterium übernimmt „je Person“ in Bewertung und Vorlage', M.presCriterion({ id: 'x', name: 'V', scope: 'person' }).scope === 'person' && M.presCriterion({ id: 'y', name: 'I' }).scope === undefined && M.newPresTemplate('T', [{ id: 'x', name: 'V', scope: 'person' }]).criteria[0].scope === 'person');
  const stdT = M.defaultPresTemplates(full);
  ok('Standardvorlagen: Kurzvortrag, Vortrag, Hausaufgaben; alle Kriterien im Startbestand, Bezug zum Pool', stdT.map((t) => t.name).join('|') === 'Kurzvortrag (ohne Handout)|Vortrag|Hausaufgaben vorstellen' && stdT.every((t) => t.criteria.every((k) => k.desc[3] && full.some((c) => c.id === k.poolId))) && !stdT[0].criteria.some((k) => k.name === 'Handout') && stdT[2].criteria.find((k) => k.name === 'Lösungsweg erklären').weight === 2);
  const edited = full.map((c) => (c.name === 'Gliederung' ? Object.assign({}, c, { desc: { 0: 'a', 1: 'b', 2: 'c', 3: 'eigene Stufe' } }) : c));
  ok('Standardvorlagen übernehmen eigene Stufentexte aus dem Pool', M.defaultPresTemplates(edited)[0].criteria.find((k) => k.name === 'Gliederung').desc[3] === 'eigene Stufe');
  ok('Standardvorlagen ergänzen: nur fehlende (Name, Groß/klein egal)', M.missingDefaultTemplates([], full).length === 3 && M.missingDefaultTemplates([{ name: 'vortrag' }], full).map((t) => t.name).join() === 'Kurzvortrag (ohne Handout),Hausaufgaben vorstellen' && M.missingDefaultTemplates(stdT, full).length === 0);
  const pdb = M.newDb();
  const pc = M.newCourse(pdb.years[0].id, { jahrgang: 12, type: 'gk' });
  const pa = M.newPres(pc, '12/1', pdb.settings, pdb.criteriaPool.slice(0, 3));
  ok('Neue Präsentation: Kopie der Kriterien mit eigener id, MSS-LIMIT', pa.kind === 'pres' && pa.pres.criteria.length === 3 && pa.pres.criteria[0].id !== pdb.criteriaPool[0].id && pa.pres.criteria[0].poolId === pdb.criteriaPool[0].id && pa.pres.limit === pdb.settings.limitMss && M.kindLabel(pa) === 'Präsentation');
  pa.pres.criteria[0].desc[0] = 'geändert';
  ok('Kriterium der Bewertung unabhängig vom Pool', pdb.criteriaPool[0].desc[0] !== 'geändert');
  pa.pres.criteria[1].weight = 2;
  const tp = M.newPresTemplate('Referat', pa.pres.criteria);
  ok('Vorlage aus Bewertung: Reihenfolge, Gewicht, Pool-Bezug, eigene Kopie', tp.name === 'Referat' && tp.criteria.length === 3 && tp.criteria[1].weight === 2 && tp.criteria[0].poolId === pdb.criteriaPool[0].id && tp.criteria[0].desc !== pa.pres.criteria[0].desc && tp.criteria[0].desc[0] === 'geändert');
  const fromTp = M.newPres(pc, '12/1', pdb.settings, tp.criteria);
  ok('Bewertung aus Vorlage: neue ids, Gewicht übernommen', fromTp.pres.criteria[1].weight === 2 && fromTp.pres.criteria[0].poolId === pdb.criteriaPool[0].id && !fromTp.pres.criteria[0].id.startsWith('undefined'));

  // 1.18: Arbeiten in Teilen – Datenbanken mit SCHEMA 1 bleiben unverändert, werden als SCHEMA 2 gespeichert
  const plain = { id: 't', kind: 'test', half: 'HJ1', cat: 'ka', weight: 1, test: { limit: 50, precision: 1, custom: {}, tasks: [{ id: 'a', max: 5 }], results: { s: { scores: { a: 3 } } } } };
  const v1 = M.migrate({ schema: 1, years: [], courses: [{ id: 'c', jahrgang: 8, students: [], assessments: [JSON.parse(JSON.stringify(plain))] }] });
  ok('SCHEMA 1 → aktuell ohne Änderung an Tests', v1.schema === M.SCHEMA && M.SCHEMA === 4 && JSON.stringify(v1.courses[0].assessments[0]) === JSON.stringify(plain));
  const withParts = M.migrate({ schema: 2, years: [], courses: [{ id: 'c', jahrgang: 8, students: [], assessments: [Object.assign(JSON.parse(JSON.stringify(plain)), { test: Object.assign({}, plain.test, { parts: [{ id: 'T', name: 'Theorie', weight: 2, limit: 40, custom: { 5: 3 } }], partMode: 'separate' }) })] }] });
  ok('Teile bleiben beim Öffnen erhalten', withParts.courses[0].assessments[0].test.parts[0].weight === 2 && withParts.courses[0].assessments[0].test.partMode === 'separate');

  // 1.30: Bereich neuer Tests einstellbar, Standard „Sonstige“
  const cdb = M.migrate({ schema: 4, years: [], courses: [], settings: { limitSek1: 50 } });
  const cc = M.newCourse('y', { klasse: '7a', fach: 'M', jahrgang: 7, type: 'sek1' });
  ok('Neuer Test: Standard „Sonstige“ (auch in alten Datenbanken)', cdb.settings.testCat === 'other' && M.newTest(cc, 'HJ1', cdb.settings).cat === 'other');
  cdb.settings.testCat = 'ka';
  ok('Neuer Test: Einstellung „Klassen-/Kursarbeit“ wirkt', M.newTest(cc, 'HJ1', cdb.settings).cat === 'ka' && M.migrate(cdb).settings.testCat === 'ka');
  const noka = M.newCourse('y', { klasse: '11', fach: 'M', jahrgang: 11, type: 'noka' });
  ok('Neuer Test im Kurs ohne Kursarbeiten bleibt „Sonstige“', M.newTest(noka, '11/1', cdb.settings).cat === 'other');

  // 1.34: Reihenfolge der Reiter
  const D = ['course', 'tests', 'epo', 'overview', 'settings'];
  ok('Reiter: leere Reihenfolge = Standard', M.orderTabs(D, []).join() === D.join() && M.migrate({ years: [], courses: [] }).settings.tabOrder.length === 0);
  ok('Reiter: gespeicherte Reihenfolge gilt', M.orderTabs(D, ['overview', 'course', 'tests', 'epo', 'settings']).join() === 'overview,course,tests,epo,settings');
  ok('Reiter: unbekannte und doppelte ids fallen weg', M.orderTabs(D, ['xyz', 'tests', 'tests', 'course', 'epo', 'overview', 'settings']).join() === 'tests,course,epo,overview,settings');
  ok('Reiter: neuer Reiter kommt hinter seinen Vorgänger', M.orderTabs(D, ['overview', 'course', 'tests', 'settings']).join() === 'overview,course,tests,epo,settings' && M.orderTabs(D, ['tests', 'settings']).join() === 'course,tests,epo,overview,settings');
  ok('Reiter verschieben (Grenzen)', M.moveTab(D, 'epo', -1).join() === 'course,epo,tests,overview,settings' && M.moveTab(D, 'course', -1).join() === D.join() && M.moveTab(D, 'overview', 5).join() === 'course,tests,epo,settings,overview');

  // 1.39: Werkzeuge im Reiter „Tools“ je Kurs
  const tdb = M.migrate({ years: [], courses: [{ id: 'k1', name: 'K' }, { id: 'k2', name: 'L', tools: { off: ['dice', 3], order: ['cards', 'timer'], extra: 1 } }] });
  const [k1, k2] = tdb.courses;
  ok('Tools: Standard alle an, Standardreihenfolge', k1.tools.off.length === 0 && k1.tools.order.length === 0 && M.toolList(k1).map((x) => x.id + (x.on ? '+' : '-')).join() === 'timer+,number+,people+,dice+,cards+');
  ok('Tools: migrate behält gültige Werte und unbekannte Felder', k2.tools.off.join() === 'dice' && k2.tools.extra === 1);
  ok('Tools: gespeicherte Reihenfolge, fehlende ergänzt', M.toolList(k2).map((x) => x.id + (x.on ? '+' : '-')).join() === 'cards+,timer+,number+,people+,dice-');
  ok('Tools: unbekannte ids fallen weg', M.toolList({ tools: { order: ['xyz', 'dice'], off: ['xyz'] } }).length === 5);
  const k3 = { tools: {} };
  M.setTools(k3, M.toolList(k3).map((x) => ({ id: x.id, on: x.id !== 'people' })));
  ok('Tools: setTools speichert Standardreihenfolge leer', k3.tools.order.length === 0 && k3.tools.off.join() === 'people');
  M.setTools(k3, [{ id: 'dice', on: true }, { id: 'timer', on: true }, { id: 'number', on: false }, { id: 'people', on: true }, { id: 'cards', on: true }]);
  ok('Tools: setTools speichert eigene Reihenfolge', k3.tools.order.join() === 'dice,timer,number,people,cards' && k3.tools.off.join() === 'number');

  const extra = M.migrate({ schema: 1, years: [], courses: [], zusatz: { a: 1 } });
  ok('Unbekannte Felder bleiben erhalten', extra.zusatz && extra.zusatz.a === 1);

  // Namensliste
  const names = M.parseNames('1\tMüller\tAnna\nSchmidt, Jonas\nLena Weber\n\n');
  ok('Namen erkannt', names.map((s) => s.last + '|' + s.first).join(';') === 'Müller|Anna;Schmidt|Jonas;Weber|Lena');

  // 1.3: alter Einzel-Sitzplan wird zum ersten Raum
  const seatOld = M.migrate({ schema: 1, years: [], courses: [{ id: 'c', jahrgang: 8, students: [], seating: { cols: 6, rows: 4, desk: 'bottom', pos: { a: { x: 1, y: 2 } } } }] });
  const sp = seatOld.courses[0].seatingPlans;
  ok('Alter Sitzplan → Raum 1', sp && sp.length === 1 && sp[0].name === 'Raum 1' && sp[0].cols === 6 && sp[0].desk === 'bottom' && sp[0].pos.a.y === 2 && !!sp[0].id);
  ok('Altes Feld seating entfernt', !('seating' in seatOld.courses[0]));

  // Statistik ohne I-Status und ohne inaktive Personen
  const stc = { students: [{ id: 'a', last: 'A' }, { id: 'b', last: 'B', iStatus: true }, { id: 'c', last: 'C', active: false }] };
  ok('Statistik ohne I-Status/inaktiv', M.statStudents(stc).map((s) => s.id).join() === 'a');
  ok('I-Status bleibt in der Liste aktiver Personen', M.activeStudents(stc).length === 2);

  // 1.12.1: Grundkurs mit Jahrgang ≤ 10 wird auf MSS umgestellt (Halbjahre und gesetzte Noten umgehängt)
  const gkOld = M.migrate({ schema: 1, years: [], courses: [
    { id: 'g', klasse: 'MSS 12', jahrgang: 5, type: 'gk', students: [], overrides: { HJ1: { s: { p: 9 } } },
      assessments: [{ id: 'x', kind: 'manual', half: 'HJ1', cat: 'other', manual: { grades: { s: { p: 11 } } } }, { id: 'y', kind: 'manual', half: 'HJ2', cat: 'ka', manual: { grades: {} } }] },
    { id: 'l', klasse: 'LK Mathe', jahrgang: 8, type: 'lk', students: [], assessments: [] },
    { id: 's', klasse: '8b', jahrgang: 8, type: 'sek1', students: [], assessments: [] },
  ] });
  const [gk, lk, s8] = gkOld.courses;
  ok('GK mit Jahrgang 5 → MSS (Jahrgang aus Klasse „MSS 12“)', gk.jahrgang === 12 && G.courseLevel(gk) === 'mss');
  ok('GK: Halbjahre umgehängt (HJ1→12/1, HJ2→12/2)', gk.assessments[0].half === '12/1' && gk.assessments[1].half === '12/2');
  ok('GK: Punkte und gesetzte Note bleiben', gk.assessments[0].manual.grades.s.p === 11 && gk.overrides['12/1'].s.p === 9 && !gk.overrides.HJ1);
  ok('LK ohne Jahrgang in der Klasse → 11', lk.jahrgang === 11 && G.courseLevel(lk) === 'mss');
  ok('Sek-I-Kurs bleibt unverändert', s8.jahrgang === 8 && G.courseLevel(s8) === 'sek1');

  // Beim Wechsel auf MSS: Standard-LIMIT und Standard-EPO-Umrechnung → MSS-Standard, eigene Werte bleiben
  const gkT = M.migrate({ schema: 1, settings: { limitSek1: 50, limitMss: 45 }, years: [], courses: [
    { id: 'g', klasse: 'GK', jahrgang: 7, type: 'gk', students: [], assessments: [
      { id: 't1', kind: 'test', half: 'HJ1', cat: 'ka', test: { limit: 50, tasks: [], results: {}, custom: {} } },
      { id: 't2', kind: 'test', half: 'HJ1', cat: 'ka', test: { limit: 40, tasks: [], results: {}, custom: {} } },
      { id: 'e1', kind: 'epo', half: 'HJ1', cat: 'other', epo: { limit: 50, table: G.epoDefaultTable('sek1', 50), lessons: [], entries: {} } },
      { id: 'e2', kind: 'epo', half: 'HJ1', cat: 'other', epo: { limit: 50, table: { strict: false, mins: [0, 10, 20] }, lessons: [], entries: {} } },
    ] },
  ] }).courses[0];
  const [t1, t2, e1, e2] = gkT.assessments;
  ok('Test mit Standard-LIMIT 50 → MSS-Standard 45', t1.test.limit === 45);
  ok('Test mit eigenem LIMIT 40 bleibt', t2.test.limit === 40);
  ok('EPO mit Standard-Umrechnung → MSS-Umrechnung (5-%-Stufen, „mehr als“)', e1.epo.limit === 45 && JSON.stringify(e1.epo.table) === JSON.stringify(G.epoDefaultTable('mss', 45)));
  ok('EPO mit eigener Umrechnung bleibt', e2.epo.table.mins.join() === '0,10,20');

  lines.unshift(fails === 0 ? 'ALLE TESTS BESTANDEN' : fails + ' FEHLGESCHLAGEN');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'fertig';
</script>
</body>
</html>
