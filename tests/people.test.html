<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Tests Personenregister</title></head>
<body>
<pre id="out"></pre>
<script src="../js/util.js"></script>
<script src="../js/grades.js"></script>
<script src="../js/attendance.js"></script>
<script src="../js/people.js"></script>
<script src="../js/model.js"></script>
<script>
  const P = NM.people;
  const M = NM.model;
  const lines = [];
  let fails = 0;
  const ok = (name, cond) => { if (!cond) fails++; lines.push((cond ? 'OK   ' : 'FAIL ') + name); };
  const throws = (name, fn) => { try { fn(); ok(name, false); } catch (e) { ok(name, true); } };
  const today = NM.util.todayISO();
  // Erfundene Personen
  const st = (id, last, first, extra = {}) => Object.assign({ id, last, first, active: true }, extra);
  const course = (id, yearId, students) => ({ id, yearId, klasse: id, fach: 'M', jahrgang: 8, students, assessments: [] });
  const fresh = () => ({
    schema: 4,
    created: '2025-08-20T10:00:00.000Z',
    years: [{ id: 'y1', name: '2025/26' }, { id: 'y2', name: '2026/27' }],
    courses: [
      course('7b', 'y1', [st('a1', 'Fischer', 'Mia'), st('a2', 'Klein', 'Noah', { email: 'n.k@example.org' })]),
      course('8b', 'y2', [st('b1', 'fischer ', ' Mia'), st('b2', 'Klein', 'Noah', { email: 'N.K@example.org' }), st('b3', 'Lang', 'Sophie')]),
      course('8bD', 'y2', [st('d1', 'Klein', 'Noa', { email: 'n.k@example.org' })]),
    ],
  });

  // ---------- Migration (Schema 4 → 5) ----------
  {
    const db = M.migrate(fresh());
    const all = db.courses.flatMap((c) => c.students);
    ok('Migration: Schema 5, Register angelegt', db.schema === 5 && Array.isArray(db.people));
    ok('Migration: jeder Kurseintrag hat eine eigene Person (nichts zusammengeführt)', all.every((s) => s.personId) && new Set(all.map((s) => s.personId)).size === all.length && db.people.length === all.length);
    ok('Migration: Name aus dem Kurseintrag, Datum der Datenbank', db.people.find((p) => p.id === all[0].personId).last === 'Fischer' && db.people.every((p) => p.created === '2025-08-20'));
    ok('Migration: keine Person ohne Kurs', db.people.every((p) => !p.orphanSince));
    ok('Migration: check ohne Fehler', M.check(db).filter((x) => x.level === 'fehler').length === 0);
    const again = JSON.stringify(M.migrate(JSON.parse(JSON.stringify(db))).people);
    ok('Migration zweimal: Register unverändert', again === JSON.stringify(db.people));
    ok('Neue Datenbank: leeres Register', Array.isArray(M.newDb().people) && M.newDb().people.length === 0 && M.newDb().schema === 5);
    const demo = M.demoDb();
    ok('Demo: jede Person im Register', demo.courses.every((c) => c.students.every((s) => demo.people.some((p) => p.id === s.personId))));
  }

  // ---------- ensure ----------
  {
    const db = M.migrate(fresh());
    const c8 = db.courses[1];
    c8.students.push(st('b4', 'Neu', 'Nora'));
    P.ensure(db);
    const neu = P.byId(db, c8.students[3].personId);
    ok('ensure: neuer Kurseintrag bekommt neue Person mit Namen', !!neu && neu.last === 'Neu' && neu.created === today);
    c8.students[3].last = 'Neumann';
    P.ensure(db);
    ok('ensure: nur in einem Kurs → Register übernimmt Namensänderung', P.byId(db, c8.students[3].personId).last === 'Neumann');
    c8.students.push(st('b5', 'X', 'Y', { personId: c8.students[0].personId }));
    P.ensure(db);
    ok('ensure: zweiter Eintrag derselben Person im selben Kurs → eigene Person', c8.students[4].personId !== c8.students[0].personId);
    c8.students.push(st('b6', 'Z', 'Z', { personId: 'gibt-es-nicht' }));
    P.ensure(db);
    ok('ensure: unbekannte personId → neue Person', !!P.byId(db, c8.students[5].personId));
    const sophie = c8.students[2].personId;
    c8.students = c8.students.filter((s) => s.id !== 'b3');
    P.ensure(db);
    ok('ensure: ohne Kurs → orphanSince heute, Person bleibt', P.byId(db, sophie).orphanSince === today);
    db.courses[0].students.push(st('a9', 'Lang', 'Sophie', { personId: sophie }));
    P.ensure(db);
    ok('ensure: wieder in einem Kurs → orphanSince weg', P.byId(db, sophie).orphanSince === undefined);
    db.people.push(null, { last: 'ohne id' });
    P.ensure(db);
    ok('ensure: ungültige Registereinträge entfernt', db.people.every((p) => p && p.id));
  }

  // ---------- matches, suggestPairs ----------
  {
    const db = M.migrate(fresh());
    const [c7, c8, cD] = db.courses;
    const m = P.matches(db, 'Fischer', 'mia');
    ok('matches: gleicher Name ohne Groß-/Kleinschreibung und Leerzeichen', m.length === 2);
    ok('matches: ohne die Personen, die schon im Kurs stehen', P.matches(db, 'Fischer', 'Mia', { exceptCourse: c8 }).length === 1);
    ok('matches: leerer Name findet nichts', P.matches(db, '', '').length === 0);
    const pairs = P.suggestPairs(db);
    const has = (a, b, why) => pairs.some((x) => [x.keep.id, x.gone.id].sort().join() === [a, b].sort().join() && x.reason === why);
    ok('Vorschlag: gleicher Name (Fischer, Mia)', has(c7.students[0].personId, c8.students[0].personId, 'name'));
    ok('Vorschlag: gleicher Name (Klein, Noah) nur einmal, nicht zusätzlich wegen Mail', has(c7.students[1].personId, c8.students[1].personId, 'name') && pairs.filter((x) => [x.keep.id, x.gone.id].includes(c7.students[1].personId) && [x.keep.id, x.gone.id].includes(c8.students[1].personId)).length === 1);
    ok('Vorschlag: gleiche Mail-Adresse bei abweichendem Namen (Noa)', has(c7.students[1].personId, cD.students[0].personId, 'mail'));
    c8.students.push(st('b7', 'Lang', 'Sophie'));
    P.ensure(db);
    ok('Vorschlag: nicht, wenn beide im selben Kurs stehen (zweimal Lang, Sophie in 8b)', !has(c8.students[2].personId, c8.students[3].personId, 'name') && P.shareCourse(db, c8.students[2].personId, c8.students[3].personId));
    cD.students.push(st('d2', 'Fischer', 'Mia'));
    P.ensure(db);
    // Mia aus 8b und Mia aus 8bD stehen nicht zusammen in einem Kurs → Vorschlag; 7b-Mia und 8bD-Mia ebenso
    ok('Vorschläge: jedes Paar höchstens einmal', new Set(P.suggestPairs(db).map((x) => [x.keep.id, x.gone.id].sort().join())).size === P.suggestPairs(db).length);
  }

  // ---------- merge, split, remove ----------
  {
    const db = M.migrate(fresh());
    const [c7, c8, cD] = db.courses;
    const keep = c7.students[0].personId, gone = c8.students[0].personId;
    P.byId(db, keep).notizen = [{ id: 'n1' }];
    P.byId(db, gone).notizen = [{ id: 'n2' }];
    P.byId(db, gone).extra = 'x';
    P.byId(db, gone).created = '2024-01-01';
    const k = P.merge(db, keep, gone);
    ok('merge: beide Kurseinträge zeigen auf die bleibende Person', c7.students[0].personId === keep && c8.students[0].personId === keep && !P.byId(db, gone));
    ok('merge: Listen zusammengelegt, fehlende Felder übernommen, älteres Datum', k.notizen.map((n) => n.id).join() === 'n1,n2' && k.extra === 'x' && k.created === '2024-01-01');
    ok('merge: Name der bleibenden Person', k.last === 'Fischer' && k.first === 'Mia');
    ok('merge: Kurse der Person', P.entries(db, keep).length === 2);
    throws('merge: gesperrt, wenn beide im selben Kurs', () => P.merge(db, c8.students[1].personId, c8.students[2].personId));
    throws('merge: unbekannte Person', () => P.merge(db, keep, 'zz'));
    // Trennen
    throws('split: nicht alle Einträge abtrennen', () => P.split(db, keep, ['a1', 'b1']));
    throws('split: keine Einträge gewählt', () => P.split(db, keep, []));
    const neu = P.split(db, keep, ['b1']);
    ok('split: Eintrag wird neue Person mit dessen Namen', c8.students[0].personId === neu.id && neu.last === 'fischer ' && neu.first === ' Mia');
    ok('split: Listen bleiben bei der bisherigen Person', P.byId(db, keep).notizen.length === 2 && !neu.notizen);
    // Löschen
    throws('remove: nicht, solange die Person in einem Kurs steht', () => P.remove(db, keep));
    const before = db.people.length;
    const o = P.orphansIf(db, (c) => c === cD);
    ok('orphansIf: Personen, die danach in keinem Kurs stehen', o.length === 1 && o[0].id === cD.students[0].personId);
    ok('orphansIf: Personen mit anderem Kurs zählen nicht', P.orphansIf(db, (c) => c === c8).every((p) => p.id !== c8.students[1].personId || P.entries(db, p.id).length === 1));
    db.courses = db.courses.filter((c) => c !== cD);
    P.ensure(db);
    P.remove(db, o[0].id);
    ok('remove: Person ohne Kurs gelöscht', db.people.length === before - 1 && !P.byId(db, o[0].id));
    ok('nach allem: check ohne Fehler', M.check(db).filter((x) => x.level === 'fehler').length === 0);
  }

  // ---------- mergePairs ----------
  {
    const db = M.migrate(fresh());
    const [c7, c8, cD] = db.courses;
    const a = c7.students[1].personId, b = c8.students[1].personId, d = cD.students[0].personId;
    // a=b und b=d nacheinander: b ist nach dem ersten Paar in a aufgegangen → zweites Paar wird zu a=d
    const r = P.mergePairs(db, [{ keepId: a, goneId: b }, { keepId: b, goneId: d }]);
    ok('mergePairs: Ketten werden aufgelöst', r.done === 2 && r.skipped === 0 && P.entries(db, a).length === 3 && !P.byId(db, b) && !P.byId(db, d));
    const r2 = P.mergePairs(db, [{ keepId: a, goneId: b }]);
    ok('mergePairs: schon dieselbe Person → übersprungen', r2.done === 0 && r2.skipped === 1);
    const r3 = P.mergePairs(db, [{ keepId: c8.students[0].personId, goneId: c8.students[2].personId }]);
    ok('mergePairs: im selben Kurs → übersprungen', r3.done === 0 && r3.skipped === 1);
    ok('mergePairs: check ohne Fehler', M.check(db).filter((x) => x.level === 'fehler').length === 0);
  }

  // ---------- check ----------
  {
    const db = M.migrate(fresh());
    db.courses[0].students[0].personId = 'weg';
    ok('check: unbekannte Person ist ein Fehler', M.check(db).some((x) => x.level === 'fehler' && /keine Person im Register/.test(x.text)));
    const db2 = M.migrate(fresh());
    db2.courses[1].students[1].personId = db2.courses[1].students[0].personId;
    ok('check: dieselbe Person zweimal im Kurs ist ein Fehler', M.check(db2).some((x) => x.level === 'fehler' && /zweimal/.test(x.text)));
    const db3 = M.migrate(fresh());
    db3.people.push({ id: 'lose', last: 'A', first: 'B', created: today });
    ok('check: Person ohne Kurs und ohne Datum ist ein Hinweis', M.check(db3).some((x) => x.level === 'hinweis' && /ohne Datum/.test(x.text)));
    const db4 = M.migrate(fresh());
    delete db4.people;
    ok('check: Schema 5 ohne Register ist ein Fehler', M.check(db4).some((x) => x.level === 'fehler' && x.where === 'Personenregister'));
  }

  // ---------- Nachteilsausgleich (2.5) ----------
  {
    const db = M.migrate(fresh());
    ok('Ausgleich: Migration setzt leere Liste', db.people.every((p) => Array.isArray(p.ausgleiche) && !p.ausgleiche.length));
    const s = db.courses[1].students[0], pid = s.personId;  // Fischer Mia, in 7b und 8b (Fach M)
    const a = P.setAusgleich(db, pid, { art: 'lrs', faecher: [], massnahmen: '  25 % mehr Zeit ', bis: '' });
    ok('Ausgleich: angelegt, bereinigt, ohne „bis“ und ohne Text', a.id && a.art === 'lrs' && a.massnahmen === '25 % mehr Zeit' && !('bis' in a) && !('text' in a) && a.faecher.length === 0);
    ok('Ausgleich: Kürzel LRS / DK / Freitext gekürzt', P.ausgleichKurz(a) === 'LRS' && P.ausgleichKurz({ art: 'dyskalkulie' }) === 'DK' && P.ausgleichKurz({ art: 'sonst', text: 'Autismus' }) === 'Autism');
    ok('Ausgleich: alle Fächer passt auch zu Kurs ohne Fach', P.ausgleichPasst(a, 'M') && P.ausgleichPasst(a, ''));
    const b = P.setAusgleich(db, pid, { art: 'sonst', text: ' ADHS ', faecher: ['Deutsch', ' deutsch', 'M '], massnahmen: '', bis: '2026-01-31' });
    ok('Ausgleich: Fächer ohne doppelte, Kürzel getrimmt', b.text === 'ADHS' && b.faecher.join('|') === 'Deutsch|M');
    ok('Ausgleich: Fach ohne Groß-/Kleinschreibung, Kurs ohne Fach passt nicht', P.ausgleichPasst(b, 'm') && P.ausgleichPasst(b, ' DEUTSCH ') && !P.ausgleichPasst(b, 'E') && !P.ausgleichPasst(b, ''));
    ok('Ausgleich: abgelaufen nach „bis“, am Tag selbst noch gültig', P.ausgleichAbgelaufen(b, '2026-02-01') && !P.ausgleichAbgelaufen(b, '2026-01-31') && !P.ausgleichAbgelaufen(a, '2099-01-01'));
    const c8 = db.courses[1];
    ok('ausgleicheFuer: nur gültige und passende', P.ausgleicheFuer(db, s, c8, '2026-01-15').length === 2 && P.ausgleicheFuer(db, s, c8, '2026-03-01').length === 1 && P.ausgleicheFuer(db, c8.students[2], c8).length === 0);
    ok('ausgleicheFuer: ohne db oder Person leer', P.ausgleicheFuer(null, s, c8).length === 0 && P.ausgleicheFuer(db, {}, c8).length === 0);
    // Ändern: Art wechseln entfernt Text, leeres „bis“ entfernt Datum, id bleibt
    const b2 = P.setAusgleich(db, pid, { id: b.id, art: 'dyskalkulie', text: 'x', faecher: ['M'], massnahmen: 'Taschenrechner', bis: '' });
    ok('Ausgleich ändern: gleiche id, Text und „bis“ entfernt', b2.id === b.id && P.byId(db, pid).ausgleiche.length === 2 && !('text' in b2) && !('bis' in b2) && b2.art === 'dyskalkulie');
    ok('Ausgleich: unbekannte Art wird „Sonstiges“, ungültiges Datum fällt weg', (() => { const x = P.setAusgleich(db, pid, { art: 'quatsch', text: 'Q', bis: '31.01.2027' }); const r = x.art === 'sonst' && !('bis' in x); P.removeAusgleich(db, pid, x.id); return r; })());
    ok('faecherDerPerson: Fächer aus den Kursen, ohne doppelte', P.faecherDerPerson(db, pid).join('|') === 'M');
    // Zusammenführen legt die Listen zusammen, Trennen lässt sie bei der Person
    const other = db.courses[0].students[0].personId;  // Fischer Mia in 7b (eigene Person nach Migration)
    P.setAusgleich(db, other, { art: 'lrs', faecher: [], massnahmen: 'alt' });
    P.merge(db, pid, other);
    ok('Zusammenführen: Ausgleiche beider Personen bleiben', P.byId(db, pid).ausgleiche.length === 3);
    P.removeAusgleich(db, pid, a.id);
    ok('removeAusgleich', P.byId(db, pid).ausgleiche.length === 2 && !P.byId(db, pid).ausgleiche.some((x) => x.id === a.id));
    const back = M.migrate(JSON.parse(JSON.stringify(db)));
    ok('Migration: Ausgleiche bleiben erhalten, kaputte Einträge fallen weg', (() => { const d = JSON.parse(JSON.stringify(db)); d.people[0].ausgleiche = [null, { art: 'lrs' }, { id: 'k', art: 'lrs' }]; M.migrate(d); return d.people[0].ausgleiche.length === 1 && Array.isArray(d.people[0].ausgleiche[0].faecher); })() && P.byId(back, pid).ausgleiche.length === 2);
    ok('Ausgleich: check ohne Fehler', M.check(db).filter((x) => x.level === 'fehler').length === 0);
  }

  // ---------- Notizverlauf (2.6) ----------
  {
    const db = M.migrate(fresh());
    ok('Notizen: Migration setzt leere Liste', db.people.every((p) => Array.isArray(p.notizen) && !p.notizen.length));
    const c7 = db.courses[0], c8 = db.courses[1];
    const s8 = c8.students[1], pid = s8.personId;          // Klein Noah in 8b
    throws('Notiz: leerer Text ist ein Fehler', () => P.setNotiz(db, pid, { text: '   ' }));
    const n1 = P.setNotiz(db, pid, { datum: '2026-11-10', courseId: c8.id, text: ' Unruhig ' });
    const n2 = P.setNotiz(db, pid, { datum: '2026-11-18', text: 'Elterngespräch' });
    const n3 = P.setNotiz(db, pid, { datum: '2026-11-10', courseId: c8.id, text: 'Später am selben Tag' });
    const n4 = P.setNotiz(db, pid, { datum: 'quatsch', courseId: c8.id, text: 'ohne gültiges Datum' });
    ok('Notiz: Text getrimmt, Kurs nur wenn gesetzt', n1.text === 'Unruhig' && n1.courseId === c8.id && !('courseId' in n2));
    ok('Notiz: ungültiges Datum → heute', n4.datum === today);
    const p = P.byId(db, pid);
    const order = P.notizen(p).map((n) => n.id);
    ok('Notizen: neueste oben, bei gleichem Datum die spätere zuerst', order.join() === [n4.id, n2.id, n3.id, n1.id].join());
    ok('Notizen: Filter nach Kurs und „ohne Kurs“', P.notizen(p, c8.id).length === 3 && P.notizen(p, 'none').map((n) => n.id).join() === n2.id && P.notizen(p, 'all').length === 4);
    const e = P.setNotiz(db, pid, { id: n1.id, datum: '2026-11-11', courseId: '', text: 'Geändert' });
    ok('Notiz ändern: gleiche id, Kurs entfernt', e.id === n1.id && !('courseId' in e) && p.notizen.length === 4 && p.notizen.find((n) => n.id === n1.id).text === 'Geändert');
    P.removeNotiz(db, pid, n4.id);
    ok('removeNotiz', p.notizen.length === 3 && !p.notizen.some((n) => n.id === n4.id));
    ok('notizen: Person ohne Liste → leer', P.notizen({ id: 'x' }).length === 0 && P.notizen(null).length === 0);
    // Zusammenführen: Klein Noah aus 7b in die Person aus 8b
    const p7 = c7.students[1].personId;
    P.setNotiz(db, p7, { datum: '2025-12-01', courseId: c7.id, text: 'Aus 7b' });
    P.merge(db, pid, p7);
    ok('Zusammenführen: Notizen beider Personen bleiben', P.byId(db, pid).notizen.length === 4);
    // Trennen: Notizen zum Kurs 7b gehen mit, ohne Kurs und 8b bleiben
    const e7 = c7.students[1];
    const neu = P.split(db, pid, [e7.id]);
    ok('Trennen: Notizen zum abgetrennten Kurs gehen mit', neu.notizen.length === 1 && neu.notizen[0].text === 'Aus 7b' && P.byId(db, pid).notizen.length === 3 && P.byId(db, pid).notizen.every((n) => n.courseId !== c7.id));
    const mia8 = c8.students[0].personId, mia7 = c7.students[0].personId;  // Fischer Mia: zwei Personen
    P.merge(db, mia8, mia7);
    const neuMia = P.split(db, mia8, [c7.students[0].id]);
    ok('Trennen ohne passende Notizen: neue Person ohne Notizliste', !('notizen' in neuMia));
    const d = JSON.parse(JSON.stringify(db)); d.people[0].notizen = [null, { id: 'a' }, { id: 'b', text: 'gut', datum: '2026-01-01' }];
    M.migrate(d);
    ok('Migration: kaputte Notizen fallen weg, gültige bleiben', d.people[0].notizen.length === 1 && d.people[0].notizen[0].id === 'b');
    ok('Notizen: check ohne Fehler', M.check(db).filter((x) => x.level === 'fehler').length === 0);
  }

  lines.unshift(fails === 0 ? 'ALLE TESTS BESTANDEN' : fails + ' FEHLGESCHLAGEN');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = 'fertig';
</script>
</body>
</html>
