<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Tests Pomodoro</title></head>
<body>
<pre id="out"></pre>
<script src="../js/util.js"></script>
<script src="../js/grades.js"></script>
<script src="../js/model.js"></script>
<script src="../js/pomodoro.js"></script>
<script>
  const P = NM.pomodoro;
  const lines = [];
  let fails = 0;
  const eq = (name, actual, expected) => {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    if (!ok) fails++;
    lines.push((ok ? 'OK   ' : 'FAIL ') + name + (ok ? '' : '  → erhalten ' + JSON.stringify(actual) + ', erwartet ' + JSON.stringify(expected)));
  };
  // Ablauf eines ganzen Durchlaufs als Liste „Phase Nummer“
  const run = (cfg) => {
    const seq = [];
    let s = { phase: 'work', index: 1 };
    while (s.phase !== 'done' && seq.length < 50) {
      seq.push(s.phase + s.index);
      s = P.next(cfg, s.phase, s.index);
    }
    return seq.join(' ');
  };

  const d = P.config(null);
  eq('Standardwerte', [d.enabled, d.count, d.work, d.short, d.long, d.tick, d.alarm], [false, 4, 25, 5, 15, 'off', 'bell']);
  eq('Eigene Werte ergänzen die Standardwerte', P.config({ pomodoro: { work: 50 } }).short, 5);
  eq('Ablauf 4 Pomodoros', run(d), 'work1 short1 work2 short2 work3 short3 work4 long4');
  eq('Ohne kurze Pause', run(Object.assign({}, d, { count: 3, short: 0 })), 'work1 work2 work3 long3');
  eq('Ohne lange Pause', run(Object.assign({}, d, { count: 2, long: 0 })), 'work1 short1 work2');
  eq('Ein Pomodoro', run(Object.assign({}, d, { count: 1 })), 'work1 long1');
  eq('Phasenlängen', ['work', 'short', 'long', 'done'].map((p) => P.phaseMinutes(d, p)), [25, 5, 15, 0]);

  // Migration ergänzt die Einstellungen
  const m = NM.model.migrate({ schema: 1, years: [], courses: [], settings: { pomodoro: { enabled: true, work: 30 } } });
  eq('Migration: Pomodoro-Einstellungen ergänzt', [m.settings.pomodoro.enabled, m.settings.pomodoro.work, m.settings.pomodoro.count], [true, 30, 4]);
  eq('Migration: alte Datenbank ohne Pomodoro', NM.model.migrate({ schema: 1, years: [], courses: [] }).settings.pomodoro.enabled, false);

  lines.unshift(fails === 0 ? 'ALLE TESTS BESTANDEN' : fails + ' FEHLGESCHLAGEN');
  document.getElementById('out').textContent = lines.join('\n');
</script>
</body>
</html>
